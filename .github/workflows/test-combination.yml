name: "Combination Tests"

on:
  workflow_call:
    inputs:
      max_parallel:
        required: false
        type: number
        default: 4
    outputs:
      results:
        description: "JSON array of individual test results"
        value: ${{ jobs.validate-results.outputs.results }}

permissions:
  contents: read
  actions: write        # dispatching argus-run.yml
  security-events: write
  packages: read
  pull-requests: write

# ============================================================================
# Scanner x threshold combinations: matrix over a parameter table.
#
# C3-C6 are the severity ladder and assert argus FAILS; they are green when it
# does. The ladder looks redundant and is not -- each threshold level has to be
# shown to enforce independently, or a gate honouring only one of them passes
# every test.
#
# max-parallel defaults to 4 rather than 6. GitHub has no cross-workflow
# concurrency bound, so each suite's limit is independent and they add up: with
# every suite at 6 the total is still ~24 parents plus 24 children. Keeping the
# per-suite numbers low is the only lever available.
# ============================================================================

jobs:
  combination:
    name: "${{ matrix.t.id }}: ${{ matrix.t.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel || 4 }}
      matrix:
        t:
          - { id: C1,  name: "trivy+syft pair",            expect: success, mode: remote,   image: "nginx:1.19.0",                            cname: c1-trivy-syft,      scanners: "trivy,syft",       sev: none,     allow: 'false' }
          - { id: C2,  name: "grype+syft pair",            expect: success, mode: remote,   image: "nginx:1.19.0",                            cname: c2-grype-syft,      scanners: "grype,syft",       sev: none,     allow: 'false' }
          - { id: C3,  name: "medium threshold on vuln",   expect: failure, mode: remote,   image: "nginx:1.19.0",                            cname: c3-medium-vuln,     scanners: "trivy",            sev: medium,   allow: 'false' }
          - { id: C4,  name: "high threshold on vuln",     expect: failure, mode: remote,   image: "nginx:1.19.0",                            cname: c4-high-vuln,       scanners: "grype",            sev: high,     allow: 'false' }
          - { id: C5,  name: "grype + critical threshold", expect: failure, mode: remote,   image: "nginx:1.19.0",                            cname: c5-grype-critical,  scanners: "grype",            sev: critical, allow: 'false' }
          - { id: C6,  name: "low threshold on vuln",      expect: failure, mode: remote,   image: "nginx:1.19.0",                            cname: c6-low-vuln,        scanners: "trivy",            sev: low,      allow: 'false' }
          - { id: C7,  name: "syft + critical on vuln",    expect: success, mode: remote,   image: "nginx:1.19.0",                            cname: c7-syft-critical,   scanners: "syft",             sev: critical, allow: 'false' }
          - { id: C8,  name: "allow_failure + multi",      expect: success, mode: remote,   image: "nginx:1.19.0",                            cname: c8-allow-multi,     scanners: "trivy,grype",      sev: critical, allow: 'true'  }
          - { id: C9,  name: "allow_failure + clean",      expect: success, mode: remote,   image: "gcr.io/distroless/static-debian12:latest", cname: c9-allow-grype-clean, scanners: "grype",          sev: low,      allow: 'true'  }
          - { id: C10, name: "discover + allow_failure",   expect: success, mode: discover, image: "",                                        cname: "",                 scanners: "trivy",            sev: medium,   allow: 'true'  }
          - { id: C14, name: "all scanners + high",        expect: success, mode: remote,   image: "alpine:3.18",                             cname: c14-all-high-alpine, scanners: "trivy,grype,syft", sev: high,    allow: 'true'  }
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: ${{ matrix.t.id }}
          expect: ${{ matrix.t.expect }}
          scan_mode: ${{ matrix.t.mode }}
          image_ref: ${{ matrix.t.image }}
          container_name: ${{ matrix.t.cname }}
          scanners: ${{ matrix.t.scanners }}
          fail_on_severity: ${{ matrix.t.sev }}
          allow_failure: ${{ matrix.t.allow }}
      - name: Record result
        if: always()
        run: |
          jq -n -c --arg id "${{ matrix.t.id }}" \
                   --arg status "${{ steps.t.outputs.status || 'FAIL' }}" \
                   --arg child "${{ steps.t.outputs.child_run_id }}" \
                   '{id:$id, status:$status, child:$child}' > "result-${{ matrix.t.id }}.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresult-${{ matrix.t.id }}
          path: result-${{ matrix.t.id }}.json
          retention-days: 7
          if-no-files-found: error

  validate-results:
    name: "Validate Combination Test Results"
    runs-on: ubuntu-latest
    needs: combination
    if: always()
    outputs:
      results: ${{ steps.collect.outputs.results }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: testresult-C*
          path: ./results
          merge-multiple: true
      - name: Build results JSON
        id: collect
        run: |
          set -uo pipefail
          cat > /tmp/detail.json <<'JSON'
          {
            "C1":  ["trivy+syft pair","Does argus complete a scan when trivy and syft run together?"],
            "C2":  ["grype+syft pair","Does argus complete a scan when grype and syft run together?"],
            "C3":  ["medium threshold on vuln","Does argus fail the workflow when nginx:1.19.0 breaches the medium threshold and allow_failure is false?"],
            "C4":  ["high threshold on vuln","Does argus fail the workflow when nginx:1.19.0 breaches the high threshold and allow_failure is false?"],
            "C5":  ["grype + critical threshold","Does argus fail the workflow when grype alone finds criticals in nginx:1.19.0 and allow_failure is false?"],
            "C6":  ["low threshold on vuln","Does argus fail the workflow when nginx:1.19.0 breaches the lowest threshold and allow_failure is false?"],
            "C7":  ["syft + critical on vuln","Does argus let a syft-only scan of nginx:1.19.0 pass at the critical threshold, since an SBOM gives the gate nothing to act on?"],
            "C8":  ["allow_failure + multi-scanner","Does argus let a trivy and grype scan that breaches the critical threshold pass when allow_failure is true?"],
            "C9":  ["allow_failure + grype + clean","Does argus let a grype scan of the clean distroless image pass at the low threshold when allow_failure is true?"],
            "C10": ["discover + allow_failure","Does argus complete a discover run at the medium threshold when allow_failure is true?"],
            "C14": ["all scanners + high + allow","Does argus let an all-scanner scan of alpine:3.18 pass at the high threshold when allow_failure is true?"]
          }
          JSON
          RESULTS=$(jq -s -c --slurpfile d /tmp/detail.json '
            # Filter by id rather than trusting the artifact glob. All suites share
            # one workflow run, so a broad pattern pulls in results from other suites and
            # tonumber then dies on a foreign id -- which is exactly how this failed.
            [ .[] | select(.id | test("^C[0-9]+$")) | { id: .id, name: ($d[0][.id][0] // .id), detail: ($d[0][.id][1] // ""), status: .status } ]
            | sort_by(.id | ltrimstr("C") | tonumber)
          ' ./results/result-*.json)
          echo "$RESULTS" | jq -e 'length > 0' >/dev/null || { echo "::error::no combination results collected"; exit 1; }
          echo "collected $(echo "$RESULTS" | jq 'length') results"
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
