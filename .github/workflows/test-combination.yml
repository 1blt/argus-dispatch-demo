name: "Combination Tests"

on:
  workflow_call:
    outputs:
      results:
        description: "JSON array of individual test results"
        value: ${{ jobs.validate-results.outputs.results }}

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read
  pull-requests: write

# ============================================================================
# Combination / pairwise tests: exercise untested parameter combinations
#
# Parameters: mode × scanners × severity × allow_failure × image
#
# These tests fill gaps identified by pairwise coverage analysis:
# - Scanner pairs never tested: trivy+syft, grype+syft
# - Severity levels never tested standalone: medium, high (without allow_failure)
# - Grype never threshold-tested
# - Discover mode gaps: grype-only, syft-only, all-scanners, allow_failure
# - allow_failure never tested with multi-scanner or discover mode
#
# See test-remote.yml for the full severity-gate contract and the DIRTY /
# CLEAN / UNKNOWN determinism anchors. Short version:
#   - allow_failure=false + a threshold the image trips => workflow FAILS,
#     and 'failure' is this suite's passing outcome.
#   - nginx:1.19.0 trips everything; distroless/static trips nothing;
#     alpine:3.18 is unknowable and must never carry a gate assertion.
#
# DISCOVER-MODE CAVEAT (C10-C13)
# ------------------------------
# argus 739ac35e also added a build-failure gate to container-scan.yml:
#
#   - name: Fail if the image build failed
#     if: steps.build.outputs.build_success != 'true' && inputs.allow_failure == false
#
# tests/dockerfiles/broken/Dockerfile is designed not to build, and discover
# mode globs the whole caller repo, so EVERY discover run in this repo trips
# that gate when allow_failure=false. The discover tests here therefore all run
# with allow_failure=true; the fail-closed path is asserted in test-discover.yml
# (D3, D4), which is the only place it can be isolated.
#
# Consequence worth knowing: with allow_failure=true the matrix job is
# continue-on-error, so C10-C13 verify the workflow completes and produces a
# summary, not that the scan found anything. Artifact-level assertions (E12)
# are what upgrade them.
# ============================================================================

jobs:
  # --------------------------------------------------------------------------
  # Scanner pair coverage
  # --------------------------------------------------------------------------

  # C1: trivy+syft pair (never tested together)
  c1-trivy-syft:
    name: "C1: trivy+syft pair"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: c1-trivy-syft
      scanners: trivy,syft
      fail_on_severity: none
      allow_failure: false

  # C2: grype+syft pair (never tested together)
  c2-grype-syft:
    name: "C2: grype+syft pair"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: c2-grype-syft
      scanners: grype,syft
      fail_on_severity: none
      allow_failure: false

  # --------------------------------------------------------------------------
  # Severity enforcement — filling medium, high, and grype threshold gaps
  # --------------------------------------------------------------------------

  # C3: medium threshold on vulnerable image (medium severity never tested)
  c3-medium-vuln:
    name: "C3: medium threshold on vuln"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: c3-medium-vuln
      scanners: trivy
      fail_on_severity: medium
      allow_failure: false

  # C4: high threshold standalone (R8 masks with allow_failure=true)
  c4-high-vuln:
    name: "C4: high threshold on vuln"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: c4-high-vuln
      scanners: grype
      fail_on_severity: high
      allow_failure: false

  # C5: grype + critical threshold (grype never threshold-tested)
  c5-grype-critical:
    name: "C5: grype + critical threshold"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: c5-grype-critical
      scanners: grype
      fail_on_severity: critical
      allow_failure: false

  # C6: lowest threshold on DIRTY -> must FAIL (completes the severity ladder:
  # low/medium/high/critical all now have a gate-fires test).
  # Was alpine:3.18 on the guess that it "has low/med vulns". Moved to the
  # DIRTY anchor so the assertion is true by construction rather than by luck.
  c6-low-vuln:
    name: "C6: low threshold on vuln"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: c6-low-vuln
      scanners: trivy
      fail_on_severity: low
      allow_failure: false

  # C7: syft + critical on DIRTY -> must PASS.
  # Was alpine:3.18 + trivy,grype + high asserting 'success', which assumed
  # alpine carries no highs — unknowable, and alpine is EOL so it probably does.
  # Repurposed to cover the syft x critical cell of the scanners x severity
  # matrix (previously listed as an untestable gap) and to prove the strongest
  # possible negative: even on the most vulnerable image in the suite, an
  # SBOM-only scan cannot trip the strictest gate. Pairs with R11 (syft x low).
  c7-syft-critical-vuln:
    name: "C7: syft + critical on vuln"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: c7-syft-critical
      scanners: syft
      fail_on_severity: critical
      allow_failure: false

  # --------------------------------------------------------------------------
  # allow_failure combinations
  # --------------------------------------------------------------------------

  # C8: multi-scanner + allow_failure (only single-scanner tested in R8)
  c8-allow-multi-scanner:
    name: "C8: allow_failure + multi-scanner"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: c8-allow-multi
      scanners: trivy,grype
      fail_on_severity: critical
      allow_failure: true

  # C9: grype + allow_failure + clean image (grype×true, low×true, true×clean)
  c9-allow-grype-clean:
    name: "C9: allow_failure + grype + clean"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: gcr.io/distroless/static-debian12:latest
      container_name: c9-allow-grype-clean
      scanners: grype
      fail_on_severity: low
      allow_failure: true

  # C10: discover + allow_failure (never tested)
  c10-discover-allow:
    name: "C10: discover + allow_failure"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: discover
      scanners: trivy
      fail_on_severity: medium
      allow_failure: true

  # --------------------------------------------------------------------------
  # Discover mode expansion
  # --------------------------------------------------------------------------

  # C11: discover + grype only (never tested)
  # allow_failure=true — see DISCOVER-MODE CAVEAT: broken/Dockerfile trips the
  # build gate on every allow_failure=false discover run in this repo.
  c11-discover-grype:
    name: "C11: discover grype only"
    needs: c10-discover-allow
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: discover
      scanners: grype
      fail_on_severity: low
      allow_failure: true

  # C12: discover + all scanners (never tested)
  c12-discover-all:
    name: "C12: discover all scanners"
    needs: c11-discover-grype
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: discover
      scanners: trivy,grype,syft
      fail_on_severity: none
      allow_failure: true

  # C13: discover + syft only + high threshold
  c13-discover-syft:
    name: "C13: discover syft only"
    needs: c12-discover-all
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: discover
      scanners: syft
      fail_on_severity: high
      allow_failure: true

  # --------------------------------------------------------------------------
  # Multi-scanner + threshold (cross-cutting)
  # --------------------------------------------------------------------------

  # C14: all scanners + high threshold + allow_failure on low-vuln image
  c14-all-high-alpine:
    name: "C14: all scanners + high + allow_failure"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: alpine:3.18
      container_name: c14-all-high-alpine
      scanners: trivy,grype,syft
      fail_on_severity: high
      allow_failure: true

  # C15: multi-scanner + medium threshold on clean image (should pass)
  c15-medium-clean:
    name: "C15: medium threshold on clean"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: gcr.io/distroless/static-debian12:latest
      container_name: c15-medium-clean
      scanners: trivy,grype
      fail_on_severity: medium
      allow_failure: false

  # --------------------------------------------------------------------------
  # Validation job
  # --------------------------------------------------------------------------
  validate-results:
    name: "Validate Combination Test Results"
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.collect.outputs.results }}
    needs:
      - c1-trivy-syft
      - c2-grype-syft
      - c3-medium-vuln
      - c4-high-vuln
      - c5-grype-critical
      - c6-low-vuln
      - c7-syft-critical-vuln
      - c8-allow-multi-scanner
      - c9-allow-grype-clean
      - c10-discover-allow
      - c11-discover-grype
      - c12-discover-all
      - c13-discover-syft
      - c14-all-high-alpine
      - c15-medium-clean
    if: always()
    steps:
      - name: Validate test outcomes
        env:
          C1: ${{ needs.c1-trivy-syft.result }}
          C2: ${{ needs.c2-grype-syft.result }}
          C3: ${{ needs.c3-medium-vuln.result }}
          C4: ${{ needs.c4-high-vuln.result }}
          C5: ${{ needs.c5-grype-critical.result }}
          C6: ${{ needs.c6-low-vuln.result }}
          C7: ${{ needs.c7-syft-critical-vuln.result }}
          C8: ${{ needs.c8-allow-multi-scanner.result }}
          C9: ${{ needs.c9-allow-grype-clean.result }}
          C10: ${{ needs.c10-discover-allow.result }}
          C11: ${{ needs.c11-discover-grype.result }}
          C12: ${{ needs.c12-discover-all.result }}
          C13: ${{ needs.c13-discover-syft.result }}
          C14: ${{ needs.c14-all-high-alpine.result }}
          C15: ${{ needs.c15-medium-clean.result }}
        run: |
          FAILURES=0

          check() {
            local name="$1" got="$2" expected="$3"
            if [ "$got" = "$expected" ]; then
              echo "PASS $name: $got (expected $expected)"
            else
              echo "FAIL $name: $got (expected $expected)"
              FAILURES=$((FAILURES + 1))
            fi
          }

          echo "============================================"
          echo "Combination Test Validation"
          echo "============================================"
          echo ""

          # Scanner pair tests — should succeed (no threshold enforcement)
          check "C1  trivy+syft pair" "$C1" "success"
          check "C2  grype+syft pair" "$C2" "success"

          # Severity enforcement. With allow_failure=false the gate is no longer
          # absorbed by container-scan.yml, so a tripped threshold must surface
          # as a workflow 'failure'. C3-C6 walk the full severity ladder
          # (medium, high, critical, low) against the DIRTY anchor; a 'success'
          # on any of them means that severity level stopped being enforced.
          check "C3  medium threshold on vuln" "$C3" "failure"
          check "C4  high threshold on vuln" "$C4" "failure"
          check "C5  grype + critical threshold" "$C5" "failure"
          check "C6  low threshold on vuln" "$C6" "failure"

          # C7 is the negative control for the ladder above: same image, same
          # allow_failure=false, strictest threshold — but syft contributes no
          # findings, so the gate must NOT fire.
          check "C7  syft + critical on vuln" "$C7" "success"

          # allow_failure — should always succeed
          check "C8  allow_failure + multi-scanner" "$C8" "success"
          check "C9  allow_failure + grype + clean" "$C9" "success"
          check "C10 discover + allow_failure" "$C10" "success"

          # Discover expansion — allow_failure=true, so the broken Dockerfile is
          # tolerated and these assert "workflow completes + summary produced".
          check "C11 discover grype only" "$C11" "success"
          check "C12 discover all scanners" "$C12" "success"
          check "C13 discover syft only" "$C13" "success"

          # Cross-cutting
          check "C14 all scanners + high + allow" "$C14" "success"
          check "C15 medium threshold on clean" "$C15" "success"

          echo ""
          echo "============================================"
          TOTAL=15
          PASSED=$((TOTAL - FAILURES))
          echo "Results: $PASSED/$TOTAL passed"
          echo "============================================"

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES combination test(s) did not produce expected outcome"
            exit 1
          fi

      - name: Build results JSON
        id: collect
        if: always()
        env:
          C1: ${{ needs.c1-trivy-syft.result }}
          C2: ${{ needs.c2-grype-syft.result }}
          C3: ${{ needs.c3-medium-vuln.result }}
          C4: ${{ needs.c4-high-vuln.result }}
          C5: ${{ needs.c5-grype-critical.result }}
          C6: ${{ needs.c6-low-vuln.result }}
          C7: ${{ needs.c7-syft-critical-vuln.result }}
          C8: ${{ needs.c8-allow-multi-scanner.result }}
          C9: ${{ needs.c9-allow-grype-clean.result }}
          C10: ${{ needs.c10-discover-allow.result }}
          C11: ${{ needs.c11-discover-grype.result }}
          C12: ${{ needs.c12-discover-all.result }}
          C13: ${{ needs.c13-discover-syft.result }}
          C14: ${{ needs.c14-all-high-alpine.result }}
          C15: ${{ needs.c15-medium-clean.result }}
        run: |
          # Two-arg form: a test "passes" when the observed job result matches
          # the result the scenario expects, which for the gate-fires tests
          # (C3-C6) is 'failure'.
          to_status() {
            local got="$1" expected="$2"
            case "$got" in
              skipped) echo "skip" ;;
              cancelled) echo "cancel" ;;
              *)
                if [ "$got" = "$expected" ]; then
                  echo "pass"
                else
                  echo "FAIL"
                fi
                ;;
            esac
          }
          RESULTS=$(jq -n -c \
            --arg c1 "$(to_status "$C1" success)" \
            --arg c2 "$(to_status "$C2" success)" \
            --arg c3 "$(to_status "$C3" failure)" \
            --arg c4 "$(to_status "$C4" failure)" \
            --arg c5 "$(to_status "$C5" failure)" \
            --arg c6 "$(to_status "$C6" failure)" \
            --arg c7 "$(to_status "$C7" success)" \
            --arg c8 "$(to_status "$C8" success)" \
            --arg c9 "$(to_status "$C9" success)" \
            --arg c10 "$(to_status "$C10" success)" \
            --arg c11 "$(to_status "$C11" success)" \
            --arg c12 "$(to_status "$C12" success)" \
            --arg c13 "$(to_status "$C13" success)" \
            --arg c14 "$(to_status "$C14" success)" \
            --arg c15 "$(to_status "$C15" success)" \
            '[
              {"id":"C1","name":"trivy+syft pair","detail":"Does argus complete a scan when trivy and syft run together?","status":$c1},
              {"id":"C2","name":"grype+syft pair","detail":"Does argus complete a scan when grype and syft run together?","status":$c2},
              {"id":"C3","name":"medium threshold on vuln","detail":"Does argus fail the workflow when nginx:1.19.0 breaches the medium threshold and allow_failure is false?","status":$c3},
              {"id":"C4","name":"high threshold on vuln","detail":"Does argus fail the workflow when nginx:1.19.0 breaches the high threshold and allow_failure is false?","status":$c4},
              {"id":"C5","name":"grype + critical threshold","detail":"Does argus fail the workflow when grype alone finds criticals in nginx:1.19.0 and allow_failure is false?","status":$c5},
              {"id":"C6","name":"low threshold on vuln","detail":"Does argus fail the workflow when nginx:1.19.0 breaches the lowest threshold and allow_failure is false?","status":$c6},
              {"id":"C7","name":"syft + critical on vuln","detail":"Does argus let a syft-only scan of nginx:1.19.0 pass at the critical threshold, since an SBOM gives the gate nothing to act on?","status":$c7},
              {"id":"C8","name":"allow_failure + multi-scanner","detail":"Does argus let a trivy and grype scan that breaches the critical threshold pass when allow_failure is true?","status":$c8},
              {"id":"C9","name":"allow_failure + grype + clean","detail":"Does argus let a grype scan of the clean distroless image pass at the low threshold when allow_failure is true?","status":$c9},
              {"id":"C10","name":"discover + allow_failure","detail":"Does argus complete a discover run at the medium threshold when allow_failure is true?","status":$c10},
              {"id":"C11","name":"discover grype only","detail":"Does argus complete a discover run with grype as the only scanner when allow_failure is true?","status":$c11},
              {"id":"C12","name":"discover all scanners","detail":"Does argus complete a discover run with trivy, grype and syft all selected when allow_failure is true?","status":$c12},
              {"id":"C13","name":"discover syft only","detail":"Does argus complete a discover run with syft as the only scanner when allow_failure is true?","status":$c13},
              {"id":"C14","name":"all scanners + high + allow","detail":"Does argus let an all-scanner scan of alpine:3.18 pass at the high threshold when allow_failure is true?","status":$c14},
              {"id":"C15","name":"medium threshold on clean","detail":"Does argus let a trivy and grype scan of the clean distroless image pass at the medium threshold?","status":$c15}
            ]')
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
