name: "Unit Tests"

on:
  workflow_call:
    inputs:
      argus_ref:
        description: 'Argus branch/tag to test'
        required: false
        type: string
        default: 'main'
    outputs:
      results:
        description: "JSON array of individual test results"
        value: ${{ jobs.collect-results.outputs.results }}

permissions:
  contents: read

jobs:
  # U1: parse-container-config unit tests
  parse-container-config:
    name: "U1: parse-container-config"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
      stats: ${{ steps.stats.outputs.stats }}
    steps:
      - name: Checkout argus
        uses: actions/checkout@v4
        with:
          repository: huntridge-labs/argus
          ref: ${{ inputs.argus_ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        # argus's own requirements, not a hand-kept list: U1 broke on a missing
        # python-slugify that has been in requirements.txt all along, and a
        # hand-kept list silently rots every time argus adds an import.
        run: |
          pip install pytest pytest-cov
          [ -f requirements.txt ] && pip install -r requirements.txt
          pip install -e . 2>/dev/null || true

      # Enumerate what this suite actually checks, so the dashboard can show the
      # individual assertions behind the one-line question instead of hiding a
      # whole pytest file behind "do the unit tests pass?". Collection is
      # best-effort and never fails the job: if the paths have moved, this comes
      # back empty and the test run below reports the breakage as usual.
      # `-o addopts=''` clears argus's pytest.ini addopts, which include -v.
      # That -v overrides our -q and makes --collect-only print a tree of
      # `<Function name>` rather than `file::Class::test` node ids, so the
      # `grep '::'` below matched nothing and every suite reported 0 checks.
      - name: Enumerate what these tests check
        id: checks
        continue-on-error: true
        env:
          PYTHONPATH: .github/actions
        run: |
          RAW=$(pytest --collect-only -q -o addopts='' .github/actions/parse-container-config/tests/test_parse_container_config.py 2>/dev/null | grep '::' || true)
          CHECKS=$(printf '%s\n' "$RAW" \
            | sed -E 's/.*:://; s/\[.*$//' \
            | sed -E 's/^test_//; s/_/ /g' \
            | awk 'NF' | sort -u | jq -R . | jq -s -c '.' 2>/dev/null)
          [ -n "$CHECKS" ] || CHECKS='[]'
          echo "Collected $(echo "$CHECKS" | jq 'length') check(s)"
          echo "checks=$CHECKS" >> "$GITHUB_OUTPUT"

      - name: Run parse-container-config tests
        run: |
          set +e
          pytest .github/actions/parse-container-config/tests/test_parse_container_config.py -v --no-cov --tb=short --junit-xml=junit.xml
          RC=$?
          exit $RC
      # Counts, not just a pass/fail dot: "U3 failed" could be one broken
      # assertion or forty. The junit report gives the split and the names of
      # what broke, so the dashboard can show severity.
      - name: Summarise pass/fail
        id: stats
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo 'stats={"total":0,"passed":0,"failed":0,"skipped":0,"failures":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json, xml.etree.ElementTree as ET
          root = ET.parse('junit.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          total = bad = skipped = 0
          names = []
          for s in suites:
              total += int(s.get('tests', 0) or 0)
              bad += int(s.get('failures', 0) or 0) + int(s.get('errors', 0) or 0)
              skipped += int(s.get('skipped', 0) or 0)
              for tc in s.iter('testcase'):
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      names.append((tc.get('name') or '').replace('test_', '', 1).replace('_', ' '))
          print('stats=' + json.dumps({
              'total': total, 'passed': max(total - bad - skipped, 0),
              'failed': bad, 'skipped': skipped, 'failures': sorted(set(names))[:20],
          }))
          PYEOF

