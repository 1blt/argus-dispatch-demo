  # U5: GHES static analysis
  ghes-static-analysis:
    name: "U5: GHES static analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
    steps:
      - name: Checkout argus
        uses: actions/checkout@v4
        with:
          repository: huntridge-labs/argus
          ref: ${{ inputs.argus_ref || 'main' }}

      - name: Enumerate what this check asserts
        id: checks
        run: |
          jq -n -c '[
            "no hardcoded github.com in scanner-container scripts",
            "no hardcoded github.com in scanner-container-summary scripts",
            "no hardcoded github.com in parse-container-config scripts",
            "no hardcoded github.com in action.yml run blocks",
            "github.server_url and GITHUB_SERVER_URL references allowed"
          ]' > checks.json
          echo "checks=$(cat checks.json)" >> "$GITHUB_OUTPUT"

      - name: Check for hardcoded github.com URLs in action scripts
        run: |
          echo "Scanning action logic for hardcoded github.com URLs..."

          # Only executable content counts. The previous version grepped whole
          # action.yml files, so a documentation link inside a `description:`
          # block scalar -- prose a GHES user never executes -- was reported as
          # a violation. Parse the YAML and look at `run:` bodies only.
          python3 - <<'PYEOF'
          import re, sys, pathlib, yaml

          DIRS = ["scanner-container", "scanner-container-summary", "parse-container-config"]
          URL = re.compile(r"https://github\.com")
          ALLOWED = ("github.server_url", "GITHUB_SERVER_URL")
          violations = []

          def scan(path, text, label):
              for i, line in enumerate(text.splitlines(), 1):
                  if not URL.search(line):
                      continue
                  if line.lstrip().startswith("#") or any(a in line for a in ALLOWED):
                      continue
                  violations.append(f"{path}:{i} ({label}): {line.strip()}")

          for d in DIRS:
              base = pathlib.Path(".github/actions") / d
              if not base.is_dir():
                  continue
              for f in base.rglob("*"):
                  if not f.is_file() or "/tests/" in str(f) or "__pycache__" in str(f):
                      continue
                  if f.suffix in (".sh", ".py"):
                      scan(str(f), f.read_text(errors="replace"), "script")
                  elif f.name == "action.yml":
                      try:
                          doc = yaml.safe_load(f.read_text())
                      except Exception as e:
                          print(f"::warning::could not parse {f}: {e}")
                          continue
                      for step in ((doc or {}).get("runs", {}) or {}).get("steps", []) or []:
                          body = step.get("run")
                          if isinstance(body, str):
                              scan(str(f), body, "run block of step %r" % (step.get("name") or "?"))

          if violations:
              print("Hardcoded github.com URLs in action logic:")
              for v in violations:
                  print("  " + v)
              print(f"::error::Found {len(violations)} hardcoded github.com URL(s) in action logic")
              sys.exit(1)
          print("No hardcoded github.com URLs in action logic")
          PYEOF

  # --------------------------------------------------------------------------
  # Collect every unit job's outcome into the results JSON the dashboard reads.
  #
  # This lived as a trailing step of ghes-static-analysis, which declared no
  # `needs:`, so every `needs.<job>.result` it referenced resolved to nothing.
  # The workflow output then pointed at `jobs.collect-results`, a job that did
  # not exist, so `results` was always empty and the dashboard reported all five
  # unit tests as "not run" no matter how they did.
  #
  # `if: always()` because a failing unit job is exactly the outcome that has to
  # reach the board.
  # --------------------------------------------------------------------------
  collect-results:
    name: "Collect unit test results"
    runs-on: ubuntu-latest
    needs:
      - parse-container-config
      - scanner-container
      - other-scanners
      - scn-detector
      - ghes-static-analysis
    if: always()
    outputs:
      results: ${{ steps.collect.outputs.results }}
    steps:
      - name: Build results JSON
        id: collect
        env:
          U1: ${{ needs.parse-container-config.result }}
          U1C: ${{ needs.parse-container-config.outputs.checks }}
          U1S: ${{ needs.parse-container-config.outputs.stats }}
          U2S: ${{ needs.scanner-container.outputs.stats }}
          U3S: ${{ needs.other-scanners.outputs.stats }}
          U4S: ${{ needs.scn-detector.outputs.stats }}
          U2C: ${{ needs.scanner-container.outputs.checks }}
          U3C: ${{ needs.other-scanners.outputs.checks }}
          U4C: ${{ needs.scn-detector.outputs.checks }}
          U5C: ${{ needs.ghes-static-analysis.outputs.checks }}
          U2: ${{ needs.scanner-container.result }}
          U3: ${{ needs.other-scanners.result }}
          U4: ${{ needs.scn-detector.result }}
          U5: ${{ needs.ghes-static-analysis.result }}
        run: |
          to_status() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "FAIL" ;;
              skipped) echo "skip" ;;
              cancelled) echo "cancel" ;;
              *) echo "unknown" ;;
            esac
          }
          # A job that never ran, or whose collection failed, yields an empty
          # string here; jq needs valid JSON either way.
          safe_arr() { if [ -n "$1" ] && echo "$1" | jq empty 2>/dev/null; then echo "$1"; else echo '[]'; fi; }
          C1=$(safe_arr "${U1C:-}"); C2=$(safe_arr "${U2C:-}"); C3=$(safe_arr "${U3C:-}")
          C4=$(safe_arr "${U4C:-}"); C5=$(safe_arr "${U5C:-}")
          safe_obj() { if [ -n "$1" ] && echo "$1" | jq -e 'type == "object"' >/dev/null 2>&1; then echo "$1"; else echo 'null'; fi; }
          S1=$(safe_obj "${U1S:-}"); S2=$(safe_obj "${U2S:-}")
          S3=$(safe_obj "${U3S:-}"); S4=$(safe_obj "${U4S:-}")

          RESULTS=$(jq -n -c \
            --argjson c1 "$C1" --argjson c2 "$C2" --argjson c3 "$C3" \
            --argjson c4 "$C4" --argjson c5 "$C5" \
            --argjson s1 "$S1" --argjson s2 "$S2" --argjson s3 "$S3" --argjson s4 "$S4" \
            --arg u1 "$(to_status "$U1")" \
            --arg u2 "$(to_status "$U2")" \
            --arg u3 "$(to_status "$U3")" \
            --arg u4 "$(to_status "$U4")" \
            --arg u5 "$(to_status "$U5")" \
            '[
              {"id":"U1","name":"parse-container-config","detail":"Do the parse-container-config unit tests pass for config parsing, schema validation and matrix generation?","status":$u1,"checks":$c1,"stats":$s1},
              {"id":"U2","name":"scanner-container","detail":"Do the scanner-container unit tests pass for the trivy parser, grype parser and summary generator?","status":$u2,"checks":$c2,"stats":$s2},
              {"id":"U3","name":"other scanner tests","detail":"Do the checkov, clamav, codeql, opengrep, trivy-iac and zap parser unit tests pass?","status":$u3,"checks":$c3,"stats":$s3},
              {"id":"U4","name":"scn-detector tests","detail":"Do the SCN detector unit tests pass for the AI classifier, diff helpers and report generation?","status":$u4,"checks":$c4,"stats":$s4},
              {"id":"U5","name":"GHES static analysis","detail":"Are the container action scripts free of hardcoded github.com URLs so they work on GHES?","status":$u5,"checks":$c5}
            ]')
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
