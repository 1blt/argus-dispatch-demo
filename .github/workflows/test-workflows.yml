name: "Top-level Workflow Tests"

on:
  workflow_call:
    outputs:
      results:
        description: "JSON array of individual test results"
        value: ${{ jobs.validate-results.outputs.results }}

permissions:
  contents: read
  actions: write        # dispatching argus-hardening-run.yml
  security-events: write
  packages: read
  pull-requests: write

# ============================================================================
# reusable-security-hardening.yml is argus's consumer-facing orchestration
# layer. It was referenced only by a workflow_dispatch-only demo, so nothing
# exercised it -- not this suite, and not argus's own CI.
#
# Dispatched rather than `uses:` for the same reason as the container suites,
# and more acutely: this workflow fans out to a dozen scanner jobs and skips
# the unselected ones, so four tests contributed roughly 48 skipped jobs to
# every run. Dispatching moves all of that into its own runs.
#
# Every test runs with allow_failure: true, which pins the fanned-out scanners
# to a 'none' threshold, so findings cannot decide the outcome. A red here
# means the orchestration broke, not that a fixture grew a CVE.
#
# max-parallel: 2 -- each of these fans out to many jobs in its child run, so
# they are far heavier than a container scan.
# ============================================================================

jobs:
  workflows:
    name: "${{ matrix.t.id }}: ${{ matrix.t.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        t:
          - { id: W1, name: "hardening, trivy-iac only",     scanners: "trivy-iac",         iac_path: "tests/iac" }
          - { id: W2, name: "hardening, lint only",          scanners: "lint",              iac_path: "" }
          - { id: W3, name: "hardening, gitleaks + trivy-iac", scanners: "gitleaks,trivy-iac", iac_path: "tests/iac" }
          - { id: W4, name: "hardening, unknown scanner",    scanners: "bogusscanner",      iac_path: "" }
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-dispatch
        with:
          test_id: ${{ matrix.t.id }}
          expect: success
          workflow: argus-hardening-run.yml
          inputs_json: >-
            {"scanners":"${{ matrix.t.scanners }}","iac_path":"${{ matrix.t.iac_path }}","allow_failure":true,"post_pr_comment":false}
      - name: Record result
        if: always()
        run: |
          jq -n -c --arg id "${{ matrix.t.id }}" \
                   --arg status "${{ steps.t.outputs.status || 'FAIL' }}" \
                   --arg child "${{ steps.t.outputs.child_run_id }}" \
                   '{id:$id, status:$status, child:$child}' > "result-${{ matrix.t.id }}.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresult-${{ matrix.t.id }}
          path: result-${{ matrix.t.id }}.json
          retention-days: 7
          if-no-files-found: error

  validate-results:
    name: "Validate Workflow Test Results"
    runs-on: ubuntu-latest
    needs: workflows
    if: always()
    outputs:
      results: ${{ steps.collect.outputs.results }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: testresult-W*
          path: ./results
          merge-multiple: true
      - name: Build results JSON
        id: collect
        run: |
          set -uo pipefail
          cat > /tmp/detail.json <<'JSON'
          {
            "W1": ["hardening trivy-iac","Does the reusable-security-hardening workflow run when a caller selects only the trivy-iac scanner?"],
            "W2": ["hardening lint","Does the reusable-security-hardening workflow run when a caller selects only the lint scanners?"],
            "W3": ["hardening multi-scanner","Does the reusable-security-hardening workflow fan out and stitch a summary when a caller selects gitleaks and trivy-iac together?"],
            "W4": ["hardening unknown scanner","Does the reusable-security-hardening workflow finish cleanly when the scanners input names nothing it recognises? (It does, by falling back to a broad default set rather than warning.)"]
          }
          JSON
          RESULTS=$(jq -s -c --slurpfile d /tmp/detail.json '
            [ .[] | select(.id | test("^W[0-9]+$")) | { id: .id, name: ($d[0][.id][0] // .id), detail: ($d[0][.id][1] // ""), status: .status } ]
            | sort_by(.id | ltrimstr("W") | tonumber)
          ' ./results/result-*.json)
          echo "$RESULTS" | jq -e 'length > 0' >/dev/null || { echo "::error::no workflow results collected"; exit 1; }
          echo "collected $(echo "$RESULTS" | jq 'length') results"
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
