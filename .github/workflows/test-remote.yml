name: "Remote Mode Tests"

on:
  workflow_call:
    outputs:
      results:
        description: "JSON array of individual test results"
        value: ${{ jobs.validate-results.outputs.results }}

permissions:
  contents: read
  actions: write        # dispatching argus-run.yml
  security-events: write
  packages: read
  pull-requests: write

# ============================================================================
# Remote mode tests, dispatch architecture.
#
# Each test is an ORDINARY job that dispatches argus-run.yml, waits for that
# run, and asserts its conclusion. The job is green exactly when its assertion
# holds -- so R6, which asserts argus BLOCKS, is green when argus blocks.
#
# Calling container-scan.yml with `uses:` instead pulls argus's whole job graph
# into this run. That made a passing gate test render red, and contributed two
# or three skipped argus jobs per test: 81 tests produced 298 checks, 127 of
# them skips. Dispatched runs are not part of a pull request's check rollup,
# so argus's jobs no longer appear there.
#
# Proven on 1blt/argus-dispatch-demo#1: three checks, zero argus jobs, zero
# skips, with a deliberately-wrong control going red.
#
# argus-run.yml MUST exist on the default branch or the dispatch 404s.
#
# SEVERITY GATE CONTRACT and DETERMINISM ANCHORS are unchanged -- see git
# history for the full notes; the anchors are DIRTY nginx:1.19.0, CLEAN
# gcr.io/distroless/static-debian12, UNKNOWN alpine:3.18 (never assert a gate
# outcome against UNKNOWN).
# ============================================================================

jobs:
  r1-vuln-all-scanners:
    name: "R1: vuln + all scanners"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R1
          expect: success
          image_ref: nginx:1.19.0
          container_name: r1-nginx-vuln
          scanners: trivy,grype,syft
          fail_on_severity: none
          allow_failure: 'false'

  r3-trivy-only:
    name: "R3: trivy only"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R3
          expect: success
          image_ref: alpine:3.18
          container_name: r3-alpine-trivy
          scanners: trivy
          fail_on_severity: none
          allow_failure: 'false'

  r4-grype-only:
    name: "R4: grype only"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R4
          expect: success
          image_ref: alpine:3.18
          container_name: r4-alpine-grype
          scanners: grype
          fail_on_severity: none
          allow_failure: 'false'

  r5-syft-only:
    name: "R5: syft only"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R5
          expect: success
          image_ref: alpine:3.18
          container_name: r5-alpine-syft
          scanners: syft
          fail_on_severity: none
          allow_failure: 'false'

  r6-fail-critical:
    name: "R6: gate fires on critical"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R6
          expect: failure
          image_ref: nginx:1.19.0
          container_name: r6-nginx-critical
          scanners: trivy,grype
          fail_on_severity: critical
          allow_failure: 'false'

  r7-pass-none:
    name: "R7: pass with none threshold"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R7
          expect: success
          image_ref: nginx:1.19.0
          container_name: r7-nginx-none
          scanners: trivy,grype
          fail_on_severity: none
          allow_failure: 'false'

  r8-allow-failure:
    name: "R8: allow failure absorbs the gate"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R8
          expect: success
          image_ref: nginx:1.19.0
          container_name: r8-nginx-allow
          scanners: trivy
          fail_on_severity: high
          allow_failure: 'true'

  r9-bad-image:
    name: "R9: bad image does not crash"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R9
          expect: any
          image_ref: nonexistent/nosuchimage:v0
          container_name: r9-bad-image
          scanners: trivy
          fail_on_severity: none
          allow_failure: 'false'

  r10-clean-strict:
    name: "R10: clean + strict threshold"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R10
          expect: success
          image_ref: gcr.io/distroless/static-debian12:latest
          container_name: r10-distroless-strict
          scanners: trivy,grype
          fail_on_severity: low
          allow_failure: 'false'

  r11-sbom-never-gates:
    name: "R11: SBOM-only never gates"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R11
          expect: success
          image_ref: alpine:3.18
          container_name: r11-syft-no-gate
          scanners: syft
          fail_on_severity: low
          allow_failure: 'false'

  r12-dedup-validation:
    name: "R12: dedup validation"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: R12
          expect: success
          image_ref: nginx:1.19.0
          container_name: r12-nginx-dedup
          scanners: trivy,grype
          fail_on_severity: none
          allow_failure: 'false'

  # --------------------------------------------------------------------------
  # R12a: the dedup assertion.
  #
  # The scan artifact now lives in the CHILD run, so this downloads it by the
  # child's run id rather than from this run.
  #
  # It compares the combined count against the SUM of each scanner's own unique
  # count. It does not compare the combined table's Total against its Unique --
  # both are post-deduplication and equal by construction, which is how an
  # earlier version of this test reported a dedup failure against an argus that
  # was deduplicating correctly.
  # --------------------------------------------------------------------------
  r12-assert-dedup:
    name: "R12a: assert dedup happened"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: r12-dedup-validation
    if: always()
    outputs:
      status: ${{ steps.assert.outputs.status }}
    steps:
      - name: Download the R12 container summary from the child run
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CHILD="${{ needs.r12-dedup-validation.outputs.child }}"
          [ -n "$CHILD" ] || { echo "::error::no child run id from R12"; exit 1; }
          mkdir -p ./r12-summary
          gh run download "$CHILD" -n scanner-summary-container-r12-nginx-dedup -D ./r12-summary

      - name: Assert the report deduplicates across scanners
        id: assert
        run: |
          set -uo pipefail
          STATUS="pass"
          fail() { echo "::error::$1"; STATUS="FAIL"; }

          if [ "${{ steps.download.outcome }}" != "success" ]; then
            fail "R12 produced no downloadable scan artifact, so dedup could not be checked"
          else
            REPORT=$(find ./r12-summary -type f -name '*.md' | head -n 1)
            if [ -z "$REPORT" ] || [ ! -s "$REPORT" ]; then
              fail "R12 artifact holds no readable markdown report"
            else
              if ! grep -qiE 'combined \(deduplicated\)|combined findings' "$REPORT"; then
                fail "Report has no combined/deduplicated section. If the report format changed, update this assertion rather than dropping it."
              fi
              SCANNER_UNIQUES=$(grep -oE '[A-Za-z]+ Scanner \([0-9]+ findings, [0-9]+ unique\)' "$REPORT" \
                                | grep -oE '[0-9]+ unique' | grep -oE '^[0-9]+')
              SCANNER_COUNT=$(printf '%s\n' "$SCANNER_UNIQUES" | grep -c '^[0-9]\+$')
              SUM_UNIQUE=$(printf '%s\n' "$SCANNER_UNIQUES" | awk '{s+=$1} END {print s+0}')
              COMBINED=$(grep -oE '[0-9]+ vulnerabilities \([0-9]+ unique\)' "$REPORT" \
                         | head -n 1 | grep -oE '\([0-9]+' | tr -dc '0-9')
              echo "scanners=$SCANNER_COUNT per-scanner-unique-sum=$SUM_UNIQUE combined=$COMBINED"
              if [ "$SCANNER_COUNT" -lt 2 ]; then
                fail "Only $SCANNER_COUNT scanner section(s); cross-scanner dedup cannot be tested."
              elif [ -z "${COMBINED:-}" ]; then
                fail "Could not read the combined finding count from the report"
              elif [ "$COMBINED" -eq 0 ]; then
                fail "Combined count is 0: nothing was scanned"
              elif [ "$COMBINED" -ge "$SUM_UNIQUE" ]; then
                fail "combined ($COMBINED) is not below the per-scanner sum ($SUM_UNIQUE): nothing was deduplicated"
              else
                echo "Deduplication collapsed $SUM_UNIQUE per-scanner findings into $COMBINED"
              fi
            fi
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "pass" ] || exit 1

  # --------------------------------------------------------------------------
  # Validation.
  #
  # Every test job is now green iff its assertion held, so this no longer
  # compares outcomes against expectations -- it only shapes the results JSON
  # the dashboard consumes.
  # --------------------------------------------------------------------------
  validate-results:
    name: "Validate Remote Test Results"
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.collect.outputs.results }}
    needs:
      - r1-vuln-all-scanners
      - r3-trivy-only
      - r4-grype-only
      - r5-syft-only
      - r6-fail-critical
      - r7-pass-none
      - r8-allow-failure
      - r9-bad-image
      - r10-clean-strict
      - r11-sbom-never-gates
      - r12-dedup-validation
      - r12-assert-dedup
    if: always()
    steps:
      - name: Build results JSON
        id: collect
        env:
          R1: ${{ needs.r1-vuln-all-scanners.result }}
          R3: ${{ needs.r3-trivy-only.result }}
          R4: ${{ needs.r4-grype-only.result }}
          R5: ${{ needs.r5-syft-only.result }}
          R6: ${{ needs.r6-fail-critical.result }}
          R7: ${{ needs.r7-pass-none.result }}
          R8: ${{ needs.r8-allow-failure.result }}
          R9: ${{ needs.r9-bad-image.result }}
          R10: ${{ needs.r10-clean-strict.result }}
          R11: ${{ needs.r11-sbom-never-gates.result }}
          R12: ${{ needs.r12-assert-dedup.result }}
        run: |
          to_status() {
            case "$1" in
              success) echo "pass" ;;
              skipped) echo "skip" ;;
              cancelled) echo "cancel" ;;
              *) echo "FAIL" ;;
            esac
          }
          RESULTS=$(jq -n -c \
            --arg r1  "$(to_status "$R1")"  --arg r3  "$(to_status "$R3")" \
            --arg r4  "$(to_status "$R4")"  --arg r5  "$(to_status "$R5")" \
            --arg r6  "$(to_status "$R6")"  --arg r7  "$(to_status "$R7")" \
            --arg r8  "$(to_status "$R8")"  --arg r9  "$(to_status "$R9")" \
            --arg r10 "$(to_status "$R10")" --arg r11 "$(to_status "$R11")" \
            --arg r12 "$(to_status "$R12")" \
            '[
              {"id":"R1","name":"vuln + all scanners","detail":"Does argus report vulnerabilities when nginx:1.19.0 is scanned with trivy, grype and syft together?","status":$r1},
              {"id":"R3","name":"trivy only","detail":"Does argus complete a scan when trivy is the only scanner selected?","status":$r3},
              {"id":"R4","name":"grype only","detail":"Does argus complete a scan when grype is the only scanner selected?","status":$r4},
              {"id":"R5","name":"syft only","detail":"Does argus generate an SBOM when syft is the only scanner selected?","status":$r5},
              {"id":"R6","name":"fail on critical","detail":"Does argus fail the workflow when nginx:1.19.0 carries criticals, fail_on_severity is critical and allow_failure is false?","status":$r6},
              {"id":"R7","name":"pass with none threshold","detail":"Does argus let a vulnerable image pass when fail_on_severity is none?","status":$r7},
              {"id":"R8","name":"allow failure","detail":"Does argus let a vulnerable image pass the high threshold when allow_failure is true?","status":$r8},
              {"id":"R9","name":"bad image","detail":"Does argus handle an image reference that cannot be pulled without crashing the workflow?","status":$r9},
              {"id":"R10","name":"clean + strict threshold","detail":"Does argus let the clean distroless image pass even at the strictest low threshold?","status":$r10},
              {"id":"R11","name":"SBOM-only never gates","detail":"Does argus let a syft-only scan pass at the low threshold, given an SBOM produces no findings to gate on?","status":$r11},
              {"id":"R12","name":"dedup validation","detail":"Does argus deduplicate the CVEs that trivy and grype both report for nginx:1.19.0? (Asserted against the scan report, not just the job result.)","status":$r12}
            ]')
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
