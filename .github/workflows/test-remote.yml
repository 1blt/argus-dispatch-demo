name: "Remote Mode Tests"

on:
  workflow_call:
    outputs:
      results:
        description: "JSON array of individual test results"
        value: ${{ jobs.validate-results.outputs.results }}

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read
  pull-requests: write

# ============================================================================
# Remote mode tests: scan pre-existing images via container-scan.yml
#
# Tests R1-R12 cover:
# - True positive detection (R1, R6, R12)
# - True negative detection (R2, R10)
# - Scanner isolation (R3, R4, R5)
# - Threshold precision (R7, R11)
# - Error handling (R8, R9)
#
# ---------------------------------------------------------------------------
# SEVERITY GATE CONTRACT (argus >= 1.x)
# ---------------------------------------------------------------------------
# container-scan.yml gates the scan job on allow_failure:
#
#   continue-on-error: ${{ inputs.allow_failure == true }}
#
# so with allow_failure=false a tripped severity threshold now FAILS the
# reusable workflow. It did not before argus 739ac35e (2026-07-09), when the
# job was unconditionally continue-on-error and every threshold test returned
# 'success' regardless of findings. Tests that exercise the gate therefore
# assert 'failure' — that is the pass condition.
#
# argus gate semantics: fail when any finding has severity >= threshold
# (argus/core/models.py:435). 'none' disables the gate entirely.
#
# ---------------------------------------------------------------------------
# DETERMINISM ANCHORS
# ---------------------------------------------------------------------------
# Public image contents drift as new CVEs are published, so only assert a gate
# outcome where the margin is overwhelming. Three anchors:
#
#   DIRTY   nginx:1.19.0                          2020 Debian buster base.
#                                                 Trips every threshold,
#                                                 critical included.
#   CLEAN   gcr.io/distroless/static-debian12     No package manager DB at all,
#                                                 so scanners report nothing.
#                                                 Trips no threshold.
#   UNKNOWN alpine:3.18                           EOL; finding counts drift.
#                                                 ONLY use with
#                                                 fail_on_severity=none,
#                                                 allow_failure=true, or a
#                                                 scanner that emits no
#                                                 findings (syft).
#
# Never assert a gate outcome against UNKNOWN — that is what made the old R11
# ("alpine has mediums but no criticals") an unfalsifiable guess.
#
# ---------------------------------------------------------------------------
# OBSERVABILITY LIMIT
# ---------------------------------------------------------------------------
# container-scan.yml declares no workflow_call outputs, so a caller can only
# observe the job result — not counts, not which scanner fired. Content-level
# assertions require downloading the scanner-summary-container-* artifacts the
# workflow uploads into this same run; see test-edge.yml (E12) for that pattern.
# ============================================================================

jobs:
  # --------------------------------------------------------------------------
  # R1: Vulnerable image + all scanners (TP-detect)
  # --------------------------------------------------------------------------
  r1-vuln-all-scanners:
    name: "R1: vuln + all scanners"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: r1-nginx-vuln
      scanners: trivy,grype,syft
      fail_on_severity: none
      allow_failure: false

  # --------------------------------------------------------------------------
  # R3: Trivy only (scanner isolation)
  # --------------------------------------------------------------------------
  r3-trivy-only:
    name: "R3: trivy only"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: alpine:3.18
      container_name: r3-alpine-trivy
      scanners: trivy
      fail_on_severity: none
      allow_failure: false

  # --------------------------------------------------------------------------
  # R4: Grype only (scanner isolation)
  # --------------------------------------------------------------------------
  r4-grype-only:
    name: "R4: grype only"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: alpine:3.18
      container_name: r4-alpine-grype
      scanners: grype
      fail_on_severity: none
      allow_failure: false

  # --------------------------------------------------------------------------
  # R5: Syft only (SBOM generation, no vuln scan)
  # --------------------------------------------------------------------------
  r5-syft-only:
    name: "R5: syft only"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: alpine:3.18
      container_name: r5-alpine-syft
      scanners: syft
      fail_on_severity: none
      allow_failure: false

  # --------------------------------------------------------------------------
  # R6: DIRTY + critical + allow_failure=false -> workflow MUST FAIL
  # This is the gate-fires test. 'failure' is the passing outcome.
  # --------------------------------------------------------------------------
  r6-fail-critical:
    name: "R6: fail on critical"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: r6-nginx-critical
      scanners: trivy,grype
      fail_on_severity: critical
      allow_failure: false

  # --------------------------------------------------------------------------
  # R7: Vulnerable image + threshold=none -> should PASS (TN-threshold)
  # --------------------------------------------------------------------------
  r7-pass-none:
    name: "R7: pass with none threshold"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: r7-nginx-none
      scanners: trivy,grype
      fail_on_severity: none
      allow_failure: false

  # --------------------------------------------------------------------------
  # R8: Vulnerable image + allow_failure=true -> should PASS (allow_failure)
  # --------------------------------------------------------------------------
  r8-allow-failure:
    name: "R8: allow failure"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: r8-nginx-allow
      scanners: trivy
      fail_on_severity: high
      allow_failure: true

  # --------------------------------------------------------------------------
  # R9: Bad image reference -> graceful error (error handling)
  # --------------------------------------------------------------------------
  r9-bad-image:
    name: "R9: bad image"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nonexistent/nosuchimage:v0
      container_name: r9-bad-image
      scanners: trivy
      fail_on_severity: none
      allow_failure: false

  # --------------------------------------------------------------------------
  # R10: Clean image + strict threshold -> should PASS (TN-threshold)
  # --------------------------------------------------------------------------
  r10-clean-strict:
    name: "R10: clean + strict threshold"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: gcr.io/distroless/static-debian12:latest
      container_name: r10-distroless-strict
      scanners: trivy,grype
      fail_on_severity: low
      allow_failure: false

  # --------------------------------------------------------------------------
  # R11: SBOM-only scan must never trip the severity gate.
  #
  # Was: alpine:3.18 + trivy,grype + critical, asserting 'success' on the
  # premise that alpine has mediums but no criticals. That premise is not
  # verifiable — alpine:3.18 is EOL and its critical count drifts — so the
  # test could flip without anything in argus changing.
  #
  # Now asserts a property that holds by construction: syft only populates
  # metadata["syft"], it never appends to all_findings
  # (argus/scanners/container.py:335-340), so no finding can satisfy
  # `severity >= low` and the gate cannot fire. Strictest real threshold,
  # allow_failure=false, UNKNOWN image — and still deterministically 'success'.
  # Regression target: an SBOM-only scan silently gaining a gating path.
  # --------------------------------------------------------------------------
  r11-sbom-never-gates:
    name: "R11: SBOM-only never gates"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: alpine:3.18
      container_name: r11-syft-no-gate
      scanners: syft
      fail_on_severity: low
      allow_failure: false

  # --------------------------------------------------------------------------
  # R12: Deduplication, actually asserted
  #
  # This test previously carried byte-identical parameters to R7 and checked
  # only that the job returned success, so its stated purpose -- cross-scanner
  # deduplication -- was never exercised. It passed for years without testing
  # the thing it is named after.
  #
  # nginx:1.19.0 scanned by trivy AND grype is guaranteed to surface the same
  # CVEs twice, so the report's unique count must come out below its total. The
  # assertion lives in r12-assert-dedup below, which reads the scan artifact.
  # --------------------------------------------------------------------------
  r12-dedup-validation:
    name: "R12: dedup validation"
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@main
    with:
      scan_mode: remote
      image_ref: nginx:1.19.0
      container_name: r12-nginx-dedup
      scanners: trivy,grype
      fail_on_severity: none
      allow_failure: false

  r12-assert-dedup:
    name: "R12a: assert dedup happened"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: r12-dedup-validation
    if: always()
    outputs:
      status: ${{ steps.assert.outputs.status }}
    steps:
      - name: Download the R12 container summary
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: scanner-summary-container-r12-nginx-dedup
          path: ./r12-summary

      - name: Assert the report deduplicates across scanners
        id: assert
        run: |
          set -uo pipefail
          STATUS="pass"
          fail() { echo "::error::$1"; STATUS="FAIL"; }

          if [ "${{ steps.download.outcome }}" != "success" ]; then
            fail "R12 produced no scan artifact, so dedup could not be checked"
          else
            REPORT=$(find ./r12-summary -type f -name '*.md' | head -n 1)
            if [ -z "$REPORT" ] || [ ! -s "$REPORT" ]; then
              fail "R12 artifact holds no readable markdown report"
            else
              echo "----- report -----"; cat "$REPORT"; echo "------------------"

              # The container reporter emits a deduplicated combined section and
              # a breakdown carrying total and unique counts per container.
              if ! grep -qiE 'combined \(deduplicated\)|combined findings' "$REPORT"; then
                fail "Report has no combined/deduplicated section. If the report format changed, update this assertion rather than dropping it."
              fi

              # Pull the first "| <total> | <unique> |" pair from the breakdown.
              NUMS=$(grep -oE '\| *[0-9]+ *\| *[0-9]+ *\|' "$REPORT" | head -n 1 | tr -dc '0-9 ')
              TOTAL=$(echo "$NUMS" | awk '{print $1}')
              UNIQUE=$(echo "$NUMS" | awk '{print $2}')
              if [ -z "${TOTAL:-}" ] || [ -z "${UNIQUE:-}" ]; then
                fail "Could not read total and unique counts from the report"
              else
                echo "total=$TOTAL unique=$UNIQUE"
                if [ "$UNIQUE" -gt "$TOTAL" ]; then
                  fail "unique ($UNIQUE) exceeds total ($TOTAL), which cannot happen after deduplication"
                elif [ "$UNIQUE" -eq "$TOTAL" ]; then
                  fail "unique equals total ($TOTAL): trivy and grype both scanned nginx:1.19.0 and nothing was deduplicated"
                else
                  echo "Deduplication removed $((TOTAL - UNIQUE)) duplicate finding(s)"
                fi
              fi
            fi
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "pass" ] || exit 1

  # --------------------------------------------------------------------------
  # Validation job: verify expected outcomes
  # --------------------------------------------------------------------------
  validate-results:
    name: "Validate Remote Test Results"
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.collect.outputs.results }}
    needs:
      - r1-vuln-all-scanners
      - r3-trivy-only
      - r4-grype-only
      - r5-syft-only
      - r6-fail-critical
      - r7-pass-none
      - r8-allow-failure
      - r9-bad-image
      - r10-clean-strict
      - r11-sbom-never-gates
      - r12-dedup-validation
      - r12-assert-dedup
    if: always()
    steps:
      - name: Validate test outcomes
        env:
          R1: ${{ needs.r1-vuln-all-scanners.result }}
          R3: ${{ needs.r3-trivy-only.result }}
          R4: ${{ needs.r4-grype-only.result }}
          R5: ${{ needs.r5-syft-only.result }}
          R6: ${{ needs.r6-fail-critical.result }}
          R7: ${{ needs.r7-pass-none.result }}
          R8: ${{ needs.r8-allow-failure.result }}
          R9: ${{ needs.r9-bad-image.result }}
          R10: ${{ needs.r10-clean-strict.result }}
          R11: ${{ needs.r11-sbom-never-gates.result }}
          R12: ${{ needs.r12-assert-dedup.result }}
        run: |
          FAILURES=0

          check() {
            local name="$1" got="$2" expected="$3"
            if [ "$got" = "$expected" ]; then
              echo "PASS $name: $got (expected $expected)"
            else
              echo "FAIL $name: $got (expected $expected)"
              FAILURES=$((FAILURES + 1))
            fi
          }

          echo "============================================"
          echo "Remote Mode Test Validation"
          echo "============================================"
          echo ""

          # Tests that should succeed
          check "R1  remote-vuln-all-scanners" "$R1" "success"
          check "R3  remote-trivy-only" "$R3" "success"
          check "R4  remote-grype-only" "$R4" "success"
          check "R5  remote-syft-only" "$R5" "success"

          # R6: the gate must fire. nginx:1.19.0 always carries criticals and
          # allow_failure=false means container-scan.yml no longer absorbs the
          # scan job's exit 1, so the reusable workflow must come back 'failure'.
          # 'success' here means the severity gate stopped enforcing — the exact
          # regression this test exists to catch.
          check "R6  remote-fail-critical" "$R6" "failure"

          # R7 should PASS (threshold=none)
          check "R7  remote-pass-none" "$R7" "success"

          # R8 should PASS (allow_failure=true)
          check "R8  remote-allow-failure" "$R8" "success"

          # R9 deliberately stays loose. An unpullable image makes every scanner
          # error out, but container-scan.yml does not pass --fail-on-scanner-error
          # to the CLI and fail_on_severity is 'none', so whether argus exits
          # non-zero on "nothing could be scanned" is not pinned down by any
          # contract we can point at. Both outcomes are accepted until argus
          # states the behaviour; E5 in test-edge.yml characterises the same hole
          # from the scanner-selection side.
          # TIGHTEN THIS once argus documents the unscannable-image exit code.
          if [ "$R9" = "success" ] || [ "$R9" = "failure" ]; then
            echo "PASS R9  remote-bad-image: $R9 (completed without crash)"
          else
            echo "FAIL R9  remote-bad-image: $R9 (unexpected state)"
            FAILURES=$((FAILURES + 1))
          fi

          # R10 should PASS (clean image + strict threshold)
          check "R10 remote-clean-strict" "$R10" "success"

          # R11 should PASS: syft emits no findings, so even fail_on_severity=low
          # with allow_failure=false cannot trip the gate.
          check "R11 remote-sbom-never-gates" "$R11" "success"

          # R12 should PASS (dedup validation)
          check "R12 remote-dedup-validation" "$R12" "success"

          echo ""
          echo "============================================"
          TOTAL=11
          PASSED=$((TOTAL - FAILURES))
          echo "Results: $PASSED/$TOTAL passed"
          echo "============================================"

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES remote test(s) did not produce expected outcome"
            exit 1
          fi

      - name: Build results JSON
        id: collect
        if: always()
        env:
          R1: ${{ needs.r1-vuln-all-scanners.result }}
          R3: ${{ needs.r3-trivy-only.result }}
          R4: ${{ needs.r4-grype-only.result }}
          R5: ${{ needs.r5-syft-only.result }}
          R6: ${{ needs.r6-fail-critical.result }}
          R7: ${{ needs.r7-pass-none.result }}
          R8: ${{ needs.r8-allow-failure.result }}
          R9: ${{ needs.r9-bad-image.result }}
          R10: ${{ needs.r10-clean-strict.result }}
          R11: ${{ needs.r11-sbom-never-gates.result }}
          R12: ${{ needs.r12-assert-dedup.result }}
        run: |
          to_status() {
            local got="$1" expected="$2"
            case "$got" in
              skipped) echo "skip" ;;
              cancelled) echo "cancel" ;;
              *)
                if [ "$got" = "$expected" ]; then
                  echo "pass"
                else
                  echo "FAIL"
                fi
                ;;
            esac
          }
          # R9 accepts both success and failure
          R9_STATUS="pass"
          if [ "$R9" != "success" ] && [ "$R9" != "failure" ]; then
            R9_STATUS="FAIL"
          fi
          RESULTS=$(jq -n -c \
            --arg r1 "$(to_status "$R1" success)" \
            --arg r3 "$(to_status "$R3" success)" \
            --arg r4 "$(to_status "$R4" success)" \
            --arg r5 "$(to_status "$R5" success)" \
            --arg r6 "$(to_status "$R6" failure)" \
            --arg r7 "$(to_status "$R7" success)" \
            --arg r8 "$(to_status "$R8" success)" \
            --arg r9 "$R9_STATUS" \
            --arg r10 "$(to_status "$R10" success)" \
            --arg r11 "$(to_status "$R11" success)" \
            --arg r12 "$(to_status "$R12" success)" \
            '[
              {"id":"R1","name":"vuln + all scanners","detail":"Does argus report vulnerabilities when nginx:1.19.0 is scanned with trivy, grype and syft together?","status":$r1},
              {"id":"R3","name":"trivy only","detail":"Does argus complete a scan when trivy is the only scanner selected?","status":$r3},
              {"id":"R4","name":"grype only","detail":"Does argus complete a scan when grype is the only scanner selected?","status":$r4},
              {"id":"R5","name":"syft only","detail":"Does argus generate an SBOM when syft is the only scanner selected?","status":$r5},
              {"id":"R6","name":"fail on critical","detail":"Does argus fail the workflow when nginx:1.19.0 carries criticals, fail_on_severity is critical and allow_failure is false?","status":$r6},
              {"id":"R7","name":"pass with none threshold","detail":"Does argus let a vulnerable image pass when fail_on_severity is none?","status":$r7},
              {"id":"R8","name":"allow failure","detail":"Does argus let a vulnerable image pass the high threshold when allow_failure is true?","status":$r8},
              {"id":"R9","name":"bad image","detail":"Does argus handle an image reference that cannot be pulled without crashing the workflow?","status":$r9},
              {"id":"R10","name":"clean + strict threshold","detail":"Does argus let the clean distroless image pass even at the strictest low threshold?","status":$r10},
              {"id":"R11","name":"SBOM-only never gates","detail":"Does argus let a syft-only scan pass at the low threshold, given an SBOM produces no findings to gate on?","status":$r11},
              {"id":"R12","name":"dedup validation","detail":"Does argus deduplicate the CVEs that trivy and grype both report for nginx:1.19.0? (Asserted against the scan report, not just the job result.)","status":$r12}
            ]')
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
