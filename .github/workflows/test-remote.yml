name: "Remote Mode Tests"

on:
  workflow_call:
    inputs:
      max_parallel:
        description: "How many tests may run at once"
        required: false
        type: number
        default: 4
    outputs:
      results:
        description: "JSON array of individual test results"
        value: ${{ jobs.validate-results.outputs.results }}

permissions:
  contents: read
  actions: write        # dispatching argus-run.yml
  security-events: write
  packages: read
  pull-requests: write

# ============================================================================
# Remote mode tests: matrix over a parameter table, dispatch architecture.
#
# TWO PROBLEMS THIS SHAPE SOLVES
# ------------------------------
# 1. Red for a correct test. Each test dispatches argus-run.yml and asserts the
#    child run's conclusion, so the job is green exactly when its assertion
#    holds. R6 asserts argus BLOCKS and is green when argus blocks. Calling
#    container-scan.yml with `uses:` instead dragged argus's whole job graph in,
#    which made a passing gate test render red and added 2-3 skipped argus jobs
#    per test.
#
# 2. Runner pressure. One hand-written job per test started every test at once:
#    ~38 parents each dispatching a child, up to 76 concurrent runners, with
#    children sitting in the queue. max-parallel bounds both halves, because a
#    parent only dispatches once it starts.
#
# WHY THE TESTS ARE A TABLE
# -------------------------
# Tabulating the parameter tuples is what exposed the duplication cut in #13 --
# R12 was byte-identical to R7, and C11-C13 all restated C10. That is much
# harder to see across 200 lines of near-identical job blocks.
#
# AGGREGATION
# -----------
# Matrix jobs share one set of outputs, last-writer-wins, so each entry writes
# its own result artifact and validate-results collects them. That is also how
# R12a finds the child run holding R12's scan report.
#
# DETERMINISM ANCHORS: DIRTY nginx:1.19.0 trips every threshold; CLEAN
# gcr.io/distroless/static-debian12 has no package DB so trips none; UNKNOWN
# alpine:3.18 drifts -- never assert a gate outcome against it.
# ============================================================================

jobs:
  remote:
    name: "${{ matrix.t.id }}: ${{ matrix.t.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel || 4 }}
      matrix:
        t:
          - { id: R1,  name: "vuln + all scanners",          expect: success, image: "nginx:1.19.0",                              cname: r1-nginx-vuln,        scanners: "trivy,grype,syft", sev: none,     allow: 'false' }
          - { id: R3,  name: "trivy only",                   expect: success, image: "alpine:3.18",                               cname: r3-alpine-trivy,      scanners: "trivy",            sev: none,     allow: 'false' }
          - { id: R4,  name: "grype only",                   expect: success, image: "alpine:3.18",                               cname: r4-alpine-grype,      scanners: "grype",            sev: none,     allow: 'false' }
          - { id: R5,  name: "syft only",                    expect: success, image: "alpine:3.18",                               cname: r5-alpine-syft,       scanners: "syft",             sev: none,     allow: 'false' }
          - { id: R6,  name: "gate fires on critical",       expect: failure, image: "nginx:1.19.0",                              cname: r6-nginx-critical,    scanners: "trivy,grype",      sev: critical, allow: 'false' }
          - { id: R7,  name: "pass with none threshold",     expect: success, image: "nginx:1.19.0",                              cname: r7-nginx-none,        scanners: "trivy,grype",      sev: none,     allow: 'false' }
          - { id: R8,  name: "allow_failure absorbs gate",   expect: success, image: "nginx:1.19.0",                              cname: r8-nginx-allow,       scanners: "trivy",            sev: high,     allow: 'true'  }
          - { id: R9,  name: "bad image does not crash",     expect: any,     image: "nonexistent/nosuchimage:v0",                 cname: r9-bad-image,         scanners: "trivy",            sev: none,     allow: 'false' }
          - { id: R10, name: "clean + strict threshold",     expect: success, image: "gcr.io/distroless/static-debian12:latest",   cname: r10-distroless-strict, scanners: "trivy,grype",     sev: low,      allow: 'false' }
          - { id: R11, name: "SBOM-only never gates",        expect: success, image: "alpine:3.18",                               cname: r11-syft-no-gate,     scanners: "syft",             sev: low,      allow: 'false' }
          - { id: R12, name: "dedup validation",             expect: success, image: "nginx:1.19.0",                              cname: r12-nginx-dedup,      scanners: "trivy,grype",      sev: none,     allow: 'false' }
    steps:
      - uses: actions/checkout@v4

      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: ${{ matrix.t.id }}
          expect: ${{ matrix.t.expect }}
          scan_mode: remote
          image_ref: ${{ matrix.t.image }}
          container_name: ${{ matrix.t.cname }}
          scanners: ${{ matrix.t.scanners }}
          fail_on_severity: ${{ matrix.t.sev }}
          allow_failure: ${{ matrix.t.allow }}

      # Matrix outputs are last-writer-wins, so each entry records its own.
      - name: Record result
        if: always()
        run: |
          jq -n -c --arg id "${{ matrix.t.id }}" \
                   --arg status "${{ steps.t.outputs.status || 'FAIL' }}" \
                   --arg child "${{ steps.t.outputs.child_run_id }}" \
                   '{id:$id, status:$status, child:$child}' > "result-${{ matrix.t.id }}.json"
          cat "result-${{ matrix.t.id }}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresult-${{ matrix.t.id }}
          path: result-${{ matrix.t.id }}.json
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # R12a: assert deduplication actually happened.
  #
  # R12's scan report lives in the run R12 dispatched, so this reads R12's
  # result artifact to learn that child run id, then pulls the report from it.
  #
  # It compares the combined count against the SUM of each scanner's own unique
  # count. It does NOT compare the combined table's Total against its Unique --
  # both are post-deduplication and equal by construction, which is how an
  # earlier version of this test reported a dedup failure against an argus that
  # was deduplicating correctly.
  # --------------------------------------------------------------------------
  r12-assert-dedup:
    name: "R12a: assert dedup happened"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: remote
    if: always()
    steps:
      - name: Get R12's child run id
        id: child
        uses: actions/download-artifact@v4
        with:
          name: testresult-R12
          path: ./r12-result

      - name: Download the scan report from that child run
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CHILD=$(jq -r '.child' ./r12-result/result-R12.json)
          [ -n "$CHILD" ] && [ "$CHILD" != "null" ] || { echo "::error::R12 recorded no child run id"; exit 1; }
          echo "R12 child run: $CHILD"
          mkdir -p ./r12-summary
          gh run download "$CHILD" -n scanner-summary-container-r12-nginx-dedup -D ./r12-summary

      - name: Assert the report deduplicates across scanners
        id: assert
        run: |
          set -uo pipefail
          STATUS="pass"
          fail() { echo "::error::$1"; STATUS="FAIL"; }

          if [ "${{ steps.download.outcome }}" != "success" ]; then
            fail "R12 produced no downloadable scan artifact, so dedup could not be checked"
          else
            REPORT=$(find ./r12-summary -type f -name '*.md' | head -n 1)
            if [ -z "$REPORT" ] || [ ! -s "$REPORT" ]; then
              fail "R12 artifact holds no readable markdown report"
            else
              if ! grep -qiE 'combined \(deduplicated\)|combined findings' "$REPORT"; then
                fail "Report has no combined/deduplicated section. If the format changed, update this assertion rather than dropping it."
              fi
              SCANNER_UNIQUES=$(grep -oE '[A-Za-z]+ Scanner \([0-9]+ findings, [0-9]+ unique\)' "$REPORT" \
                                | grep -oE '[0-9]+ unique' | grep -oE '^[0-9]+')
              SCANNER_COUNT=$(printf '%s\n' "$SCANNER_UNIQUES" | grep -c '^[0-9]\+$')
              SUM_UNIQUE=$(printf '%s\n' "$SCANNER_UNIQUES" | awk '{s+=$1} END {print s+0}')
              COMBINED=$(grep -oE '[0-9]+ vulnerabilities \([0-9]+ unique\)' "$REPORT" \
                         | head -n 1 | grep -oE '\([0-9]+' | tr -dc '0-9')
              echo "scanners=$SCANNER_COUNT per-scanner-unique-sum=$SUM_UNIQUE combined=$COMBINED"
              if [ "$SCANNER_COUNT" -lt 2 ]; then
                fail "Only $SCANNER_COUNT scanner section(s); cross-scanner dedup cannot be tested."
              elif [ -z "${COMBINED:-}" ]; then
                fail "Could not read the combined finding count"
              elif [ "$COMBINED" -eq 0 ]; then
                fail "Combined count is 0: nothing was scanned"
              elif [ "$COMBINED" -ge "$SUM_UNIQUE" ]; then
                fail "combined ($COMBINED) is not below the per-scanner sum ($SUM_UNIQUE): nothing was deduplicated"
              else
                echo "Deduplication collapsed $SUM_UNIQUE per-scanner findings into $COMBINED"
              fi
            fi
          fi
          [ "$STATUS" = "pass" ] || exit 1

  # --------------------------------------------------------------------------
  # Collect every matrix entry's result artifact into the dashboard's JSON.
  # --------------------------------------------------------------------------
  validate-results:
    name: "Validate Remote Test Results"
    runs-on: ubuntu-latest
    needs: [remote, r12-assert-dedup]
    if: always()
    outputs:
      results: ${{ steps.collect.outputs.results }}
    steps:
      - name: Download every test result
        uses: actions/download-artifact@v4
        with:
          pattern: testresult-R*
          path: ./results
          merge-multiple: true

      - name: Build results JSON
        id: collect
        env:
          R12A: ${{ needs.r12-assert-dedup.result }}
        run: |
          set -uo pipefail
          cat > /tmp/detail.json <<'JSON'
          {
            "R1":  ["vuln + all scanners","Does argus report vulnerabilities when nginx:1.19.0 is scanned with trivy, grype and syft together?"],
            "R3":  ["trivy only","Does argus complete a scan when trivy is the only scanner selected?"],
            "R4":  ["grype only","Does argus complete a scan when grype is the only scanner selected?"],
            "R5":  ["syft only","Does argus generate an SBOM when syft is the only scanner selected?"],
            "R6":  ["fail on critical","Does argus fail the workflow when nginx:1.19.0 carries criticals, fail_on_severity is critical and allow_failure is false?"],
            "R7":  ["pass with none threshold","Does argus let a vulnerable image pass when fail_on_severity is none?"],
            "R8":  ["allow failure","Does argus let a vulnerable image pass the high threshold when allow_failure is true?"],
            "R9":  ["bad image","Does argus handle an image reference that cannot be pulled without crashing the workflow?"],
            "R10": ["clean + strict threshold","Does argus let the clean distroless image pass even at the strictest low threshold?"],
            "R11": ["SBOM-only never gates","Does argus let a syft-only scan pass at the low threshold, given an SBOM produces no findings to gate on?"],
            "R12": ["dedup validation","Does argus deduplicate the CVEs that trivy and grype both report for nginx:1.19.0? (Asserted against the scan report, not just the job result.)"]
          }
          JSON

          # R12's headline status is R12a's verdict: the scan completing proves
          # nothing about deduplication, which is the thing R12 is named for.
          case "$R12A" in
            success) R12_STATUS=pass ;;
            skipped) R12_STATUS=skip ;;
            *)       R12_STATUS=FAIL ;;
          esac

          RESULTS=$(jq -s -c --slurpfile d /tmp/detail.json --arg r12 "$R12_STATUS" '
            # Filter by id rather than trusting the artifact glob. All suites share
            # one workflow run, so a broad pattern pulls in results from other suites
            # and tonumber then dies on a foreign id -- which is exactly how this
            # failed: pattern was testresult-* and it swallowed C, D and E.
            [ .[] | select(.id | test("^R[0-9]+$")) | {
                id: .id,
                name: ($d[0][.id][0] // .id),
                detail: ($d[0][.id][1] // ""),
                status: (if .id == "R12" then $r12 else .status end)
              } ]
            | sort_by(.id | ltrimstr("R") | tonumber)
          ' ./results/result-*.json)

          echo "$RESULTS" | jq -e 'length > 0' >/dev/null || { echo "::error::no test results collected"; exit 1; }
          echo "collected $(echo "$RESULTS" | jq 'length') results"
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
