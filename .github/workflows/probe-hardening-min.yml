name: "probe hardening minimal"
run-name: "argus ${{ inputs.marker }}"
on:
  workflow_dispatch:
    inputs:
      marker: { required: true, type: string }
permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write
  checks: write
  id-token: write
jobs:
  scan:
    uses: huntridge-labs/argus/.github/workflows/reusable-security-hardening.yml@main
