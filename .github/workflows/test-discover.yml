name: "Discover Mode Tests"

on:
  workflow_call:
    outputs:
      results:
        description: "JSON array of individual test results"
        value: ${{ jobs.validate-results.outputs.results }}

permissions:
  contents: read
  actions: write        # dispatching argus-run.yml
  security-events: write
  packages: read
  pull-requests: write

# ============================================================================
# Discover mode tests, dispatch architecture.
#
# Each test dispatches argus-run.yml and asserts the child run's conclusion, so
# the job is green exactly when its assertion holds. D3 and D4 assert that
# argus FAILS -- they are green when it does.
#
# D4 keeps `if: always()`. It no longer needs it to survive D3 (D3 is green now
# when it passes), but it still needs it if D3 genuinely breaks, and the
# dependency exists only to serialise discover runs.
#
# Discover mode builds the Dockerfiles under tests/, so the child run checks
# out the same ref this workflow runs from.
# ============================================================================

jobs:
  d1-discover-mixed:
    name: "D1: discover mixed"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: D1
          expect: success
          scan_mode: discover
          scanners: trivy,grype
          fail_on_severity: none
          allow_failure: 'true'

  d2-discover-trivy-only:
    name: "D2: discover trivy only"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: d1-discover-mixed
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: D2
          expect: success
          scan_mode: discover
          scanners: trivy
          fail_on_severity: none
          allow_failure: 'true'

  d3-discover-fail-closed:
    name: "D3: discover fail-closed"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: d2-discover-trivy-only
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: D3
          expect: failure
          scan_mode: discover
          scanners: trivy,grype
          fail_on_severity: critical
          allow_failure: 'false'

  d4-build-gate-isolated:
    name: "D4: build gate (severity=none)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: d3-discover-fail-closed
    if: always()
    outputs:
      status: ${{ steps.t.outputs.status }}
      child: ${{ steps.t.outputs.child_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: D4
          expect: failure
          scan_mode: discover
          scanners: trivy
          fail_on_severity: none
          allow_failure: 'false'

  validate-results:
    name: "Validate Discover Test Results"
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.collect.outputs.results }}
    needs:
      - d1-discover-mixed
      - d2-discover-trivy-only
      - d3-discover-fail-closed
      - d4-build-gate-isolated
    if: always()
    steps:
      - name: Build results JSON
        id: collect
        env:
          D1: ${{ needs.d1-discover-mixed.result }}
          D2: ${{ needs.d2-discover-trivy-only.result }}
          D3: ${{ needs.d3-discover-fail-closed.result }}
          D4: ${{ needs.d4-build-gate-isolated.result }}
        run: |
          to_status() {
            case "$1" in
              success) echo "pass" ;;
              skipped) echo "skip" ;;
              cancelled) echo "cancel" ;;
              *) echo "FAIL" ;;
            esac
          }
          RESULTS=$(jq -n -c \
            --arg d1 "$(to_status "$D1")" --arg d2 "$(to_status "$D2")" \
            --arg d3 "$(to_status "$D3")" --arg d4 "$(to_status "$D4")" \
            '[
              {"id":"D1","name":"discover mixed","detail":"Does argus complete a discover run over all three Dockerfiles when allow_failure is true?","status":$d1},
              {"id":"D2","name":"discover trivy only","detail":"Does argus complete a discover run with trivy as the only scanner when allow_failure is true?","status":$d2},
              {"id":"D3","name":"discover fail-closed","detail":"Does argus fail the workflow when a discover run hits both a broken build and criticals with allow_failure false?","status":$d3},
              {"id":"D4","name":"build gate isolated","detail":"Does argus fail the workflow when a discovered Dockerfile does not build, even with the severity gate switched off?","status":$d4}
            ]')
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
